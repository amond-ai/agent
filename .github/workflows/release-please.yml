name: Release Please

on:
  push:
    branches:
      - main

# The App token carries the write permissions — GITHUB_TOKEN needs none.
permissions: {}

# A release must not be cancelled halfway through tagging or publishing: a newer
# push waits for the running release instead. Only the newest push waits; an
# older waiting run is dropped, which loses nothing because release-please reads
# the whole of main on every run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          # Narrow the token to what release-please needs — without these the
          # token inherits every permission the App holds on the installation.
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes exactly the packages this run released, from the release commit
  # release-please just tagged. One job rather than a matrix: a grouped release
  # tags every package at once, and they share one install and one build.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm's trusted publishing: the registry mints the credential from this
      # OIDC token, so there is no npm token to hold, and the published version
      # carries a provenance attestation tied to this workflow and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0 # git hooks are for developer machines, not CI

      # Builds, then publishes in dependency order, skipping any version already
      # on the registry — see the script for why none of the three is optional.
      - name: Publish to npm
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: bun scripts/publish.ts
